name: Verify playable web demo
on:
  push:
  pull_request:
jobs:
  game-engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate scripts
        run: |
          node --check web/engine.js
          node --check web/app.js
          node --check web/preferences.js
          node --check web/effects.js
          node --check tests/effects.test.js
          node --check tests/preferences.test.js
          node --check tests/ui_contract.test.js
      - name: Run deterministic gameplay tests
        run: |
          node tests/engine.test.js
          node tests/autoplay.test.js
          node tests/ui_contract.test.js
          node tests/preferences.test.js