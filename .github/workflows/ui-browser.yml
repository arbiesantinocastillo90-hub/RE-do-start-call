name: Verify browser UI accessibility
on:
  push:
  pull_request:
jobs:
  browser-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright browser test tools
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Test quiet UI with a real headless browser
        run: npx playwright test tests/ui_browser.spec.cjs tests/setup_browser.spec.cjs --workers=1 --reporter=line
      - name: Attach desktop / mobile UI screenshots and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-c-quiet-ui-screenshots
          path: |
            quiet-ui-setup.png
            quiet-ui-mobile.png
            release-setup-desktop.png
            release-setup-mobile.png
            test-results/
          if-no-files-found: warn
